[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lang-learn"
version = "0.1.0"
description = "Модуль изучения иностранного языка (TTS/STT/LLM, учебное ядро)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Developer" }]
keywords = ["language-learning", "tts", "stt", "llm", "education"]
dependencies = [
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
lang-learn = "lang_learn.cli:main"

[project.optional-dependencies]
audio = [
    "numpy>=1.24.0",
    "sounddevice>=0.4.6",
    "pyttsx3>=2.90",
    "faster-whisper>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lang_learn = [
    "py.typed",
    "data/pre_a0/*.json",
    "data/travel/*.json",
    "data/trajectories/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
